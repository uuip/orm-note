[project]
name = "orm-note"
version = "0.1.0"
description = ""
authors = [
    { name = "uuip", email = "uuip@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "sqlalchemy >=2.0.48",
    "pydantic >=2.12.5",
    "pydantic-settings >=2.13.1",
    "pyyaml >=6.0.3",
    "pandas >=3.0.1",
    "mimesis >=19.1.0",
    "asyncpg >=0.31.0",
    "psycopg[binary,pool] >=3.3.3",
    "mysql-connector-python >=9.6.0",
    "pymysql >=1.1.2",
    "cryptography >=46.0.5"
]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = [
    "F405",
    "F403",
]

[dependency-groups]
mock = [
    "polyfactory (>=3.3.0)",
    "mimesis (>=19.1.0)",
    "faker (>=40.8.0)",
    "model-bakery (>=1.23.3)",
    "hypothesis (>=6.151.9)"
]
