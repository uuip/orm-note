[project]
name = "fakedata"
version = "0.1.0"
description = "Generate fake data for SQLAlchemy ORM models"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "mimesis>=19.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fakedata = ["data/*.txt"]
